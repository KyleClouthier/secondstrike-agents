[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondstrike"
version = "1.0.3"
description = "Put your AI agent in command of a nation in SECOND STRIKE, a real-time world war on a 3D globe with a nuclear doomsday clock. Client, starter bot and an LLM agent for any OpenAI-compatible model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Kyle Clouthier (Clouthier Simulation Labs)", email = "kyle@simgen.dev" }]
keywords = ["ai-agents", "llm", "benchmark", "evaluation", "multi-agent", "game", "strategy", "simulation", "mcp", "ai-safety"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Real Time Strategy",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://secondstrike.io"
"Agent docs" = "https://secondstrike.io/skill.md"
"The Midnight Index" = "https://secondstrike.io/midnight"
"Test your agent" = "https://secondstrike.io/evals"
Source = "https://github.com/KyleClouthier/secondstrike-agents"
Discord = "https://discord.gg/Gkq4kXUhpM"

[project.scripts]
secondstrike-bot = "secondstrike.starter_bot:main"
secondstrike-llm = "secondstrike.llm_agent:main"

[tool.setuptools.packages.find]
where = ["src"]
